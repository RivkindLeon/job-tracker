name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  # Registry for make targets — keep in sync with Makefile
  GO_VERSION: '1.22'
  NODE_VERSION: 22

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run make vet
        run: make vet

      - name: Run make fmt-check
        run: make fmt-check

      - name: Run make lint
        run: make lint

      - name: Run make test
        run: make test

      - name: Run make build
        run: make build
