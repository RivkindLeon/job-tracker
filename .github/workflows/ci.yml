name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go vet
        run: go vet ./server/...

      - name: Run Go tests
        run: go test ./server/... -v -count=1

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Check formatting
        run: npm run format:check

      - name: Build app
        run: npm run build
